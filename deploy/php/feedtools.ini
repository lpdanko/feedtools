memory_limit = 1024M
max_execution_time = 600
max_input_time = 600
post_max_size = 1024M
upload_max_filesize = 1024M
max_file_uploads = 20
date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.cookie_secure = 1
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
